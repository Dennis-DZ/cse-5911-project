[platformio]
default_envs = uno

; Arduino environment for actual deployment
[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3

; Native environment for running tests on your computer
[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++11
    -DUNIT_TEST
